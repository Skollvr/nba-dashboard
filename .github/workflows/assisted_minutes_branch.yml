name: Assisted minutes tests
on:
  push:
    branches:
      - test/assisted-minutes-pregame-2026-27
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt pytest
      - run: python -m compileall -q assisted_minutes.py tests/test_assisted_minutes.py
      - run: python -m pytest -q tests/test_assisted_minutes.py tests/test_projection_validation.py tests/test_matchup_calibration.py
