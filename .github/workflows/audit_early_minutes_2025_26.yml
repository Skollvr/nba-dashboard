name: Historical 2025-26 early-sample minutes audit
on:
  push:
    branches: [analysis/minutes-early-history-2025-26]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  early-minutes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: |
          python -m pip install -r requirements.txt
          python -m py_compile tools/audit_early_minutes_2025_26.py
      - name: Evaluate 1-9 previous appearances
        run: python -u tools/audit_early_minutes_2025_26.py
        env:
          PYTHONPATH: .
          STREAMLIT_SERVER_HEADLESS: 'true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: espn-early-2025-26-minutes-audit
          path: early_minutes_results/
          if-no-files-found: warn
