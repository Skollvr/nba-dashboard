name: Historical 2025-26 complete V4 and minutes backtest

on:
  push:
    branches:
      - analysis/backtest-v4-full-2025-26
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-v4-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Syntax and regression
        run: |
          python -m py_compile tools/backtest_2025_26_v4_full.py
          python -m pytest -q tests/test_projection_validation.py tests/test_matchup_calibration.py
      - name: Full six-month V4 and minutes replay
        run: python -u tools/backtest_2025_26_v4_full.py
        env:
          PYTHONPATH: .
          STREAMLIT_SERVER_HEADLESS: 'true'
      - name: Upload report files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: espn-v4-full-six-months-minutes-2025-26
          path: full_v4_results/
          if-no-files-found: warn
          retention-days: 30
