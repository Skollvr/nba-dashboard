name: Historical 2025-26 Matchup V4 pilot

on:
  push:
    branches:
      - analysis/backtest-v4-2025-26-pilot
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v4-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Syntax
        run: python -m py_compile tools/backtest_2025_26_v4_pilot.py
      - name: Native Matchup V4 ESPN replay
        run: python -u tools/backtest_2025_26_v4_pilot.py
        env:
          PYTHONPATH: .
          STREAMLIT_SERVER_HEADLESS: 'true'
      - name: Collect V4 pilot diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: espn-2025-26-v4-pilot
          path: v4_pilot_results/
          if-no-files-found: warn
