name: ESPN stats and projection regression tests

on:
  push:
    branches:
      - main
      - test/nicegui-prototype
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install requirements and pytest
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Syntax check
        run: python -m compileall -q api_espn.py api_odds.py espn_context.py processamento.py projection_validation.py ui_components.py ui_refresh.py app.py pdf_reader.py injury_sources.py
      - name: ESPN and projection tests
        run: |
          python -m pytest -q \
            tests/test_espn_player_gamelog.py \
            tests/test_projection_validation.py \
            tests/test_matchup_calibration.py \
            tests/test_analysis_season.py \
            tests/test_espn_brasilia_pregame.py \
            tests/test_espn_injuries_fallback.py \
            tests/test_nba_official_injury_pdf.py \
            tests/test_nba_pdf_recovery.py \
            tests/test_ui_refresh.py \
            tests/test_betmgm_odds.py \
            tests/test_fanduel_odds.py \
            tests/test_fanduel_http_diagnostics.py \
            tests/test_odds_brasilia_time_import.py
