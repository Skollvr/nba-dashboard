name: Monitor V4 - pregame snapshots and results

on:
  schedule:
    # GitHub Actions may delay/drop cron runs by hours. Retry every 30 minutes
    # during the pregame/evening window (14:11-01:41 BRT, UTC-03).
    # A delayed run may execute at ANY time: mode is selected by the actual
    # clock and the strict per-game 20-360 minute pre-tipoff guard in Python.
    - cron: "11,41 0-4,17-23 * * *"
    # Morning and midday retries for completed ESPN box scores. These runs
    # may also capture any genuinely upcoming early-tipoff games.
    - cron: "13 11,15 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run: both, snapshot or settle"
        required: true
        type: choice
        default: both
        options:
          - both
          - snapshot
          - settle

permissions:
  contents: write

concurrency:
  group: nba-v4-monitor-main
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Dependencies
        run: |
          python -m pip install -r requirements.txt
      - name: Baseline recorded data for this run
        run: python monitor_audit.py before
      - name: Capture immutable predictions before tipoff
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'both' || inputs.mode == 'snapshot')) }}
        env:
          SPORTSGAMEODDS_API_KEY: ${{ secrets.SPORTSGAMEODDS_API_KEY }}
        run: |
          set -o pipefail
          python model_tracking.py snapshot | tee capture.log
      - name: Resolve finished ESPN games
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'both' || inputs.mode == 'settle')) }}
        run: |
          set -o pipefail
          python model_tracking.py settle | tee settle.log
      - name: Verify captured records and create GitHub run summary
        run: python monitor_audit.py after
      - name: Persist only collected source records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -d data ]; then git add -A data/; fi
          if git diff --cached --quiet; then
            echo "No new validated snapshots or completed games"
          else
            git commit -m "data: append recorded pregame V4 forecasts and results [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
