name: Monitor V4 - pregame snapshots and results

on:
  schedule:
    # GitHub cron uses UTC. Move away from minute :00 to reduce queue contention.
    # Capture only before NBA tipoff: 16:47, 19:17 and 22:17 (Brasilia, UTC-03).
    - cron: "47 19 * * *"
    - cron: "17 1,22 * * *"
    # 01:17 is now settlement, never a pregame capture.
    # Try early results at 01:17; complete follow-ups at 08:13 and 12:13 BRT.
    - cron: "17 4 * * *"
    - cron: "13 11,15 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run: both, snapshot or settle"
        required: true
        type: choice
        default: both
        options:
          - both
          - snapshot
          - settle

permissions:
  contents: write

concurrency:
  group: nba-v4-monitor-main
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Dependencies
        run: |
          python -m pip install -r requirements.txt
      - name: Baseline recorded data for this run
        run: python monitor_audit.py before
      - name: Capture immutable predictions before tipoff
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.mode == 'both' || inputs.mode == 'snapshot') || github.event_name == 'schedule' && (github.event.schedule == '47 19 * * *' || github.event.schedule == '17 1,22 * * *') }}
        env:
          SPORTSGAMEODDS_API_KEY: ${{ secrets.SPORTSGAMEODDS_API_KEY }}
        run: |
          set -o pipefail
          python model_tracking.py snapshot | tee capture.log
      - name: Resolve finished ESPN games
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.mode == 'both' || inputs.mode == 'settle') || github.event_name == 'schedule' && (github.event.schedule == '17 4 * * *' || github.event.schedule == '13 11,15 * * *') }}
        run: |
          set -o pipefail
          python model_tracking.py settle | tee settle.log
      - name: Verify captured records and create GitHub run summary
        run: python monitor_audit.py after
      - name: Persist only collected source records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -d data ]; then git add -A data/; fi
          if git diff --cached --quiet; then
            echo "No new validated snapshots or completed games"
          else
            git commit -m "data: append recorded pregame V4 forecasts and results [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
