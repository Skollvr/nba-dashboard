name: Visual smoke — NBA Dashboard desktop and mobile

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install app and browser smoke dependencies
        run: |
          python -m pip install -r requirements.txt playwright
          python -m playwright install chromium
      - name: Exercise dashboard and capture desktop/mobile screenshots
        run: |
          streamlit run app.py --server.headless=true --server.port=8501 --server.address=127.0.0.1 > /tmp/streamlit-visual.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT
          python scripts/visual_smoke.py
      - name: Attach visual screenshots and app log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-visual-smoke
          path: |
            visual_smoke/
            /tmp/streamlit-visual.log
          retention-days: 14
